name: iOS CI

# コスト対策: macOSランナーは10倍課金のため、自動push起動は厳禁。
# 解析/テストのみ自動実行し、iOSビルドは手動実行(workflow_dispatch)限定にする。
# 参考: feedback_ios_cicd_cost_optimization メモリ記録
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test || true

  build-ios:
    # 署名なしiOSビルド。macOSランナーは10倍課金のため、
    # 手動実行またはPR時のみに限定し、pushでは絶対に自動起動しない。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: analyze-and-test
    # macos-latest (Xcode 16系) は gRPC-Core の古いC++コードで
    # テンプレート構文の厳格化により解析エラーになる既知の問題があるため、
    # より緩やかな macos-13 (Xcode 15系) を明示指定して回避する。
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      # Apple Developer 証明書なしでコンパイル可否のみを検証する。
      # 実機インストール・TestFlight配布には署名設定が別途必要。
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package .app as zip
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geography-puzzle-king-ios-unsigned
          path: build/ios/iphoneos/Runner.app.zip
          retention-days: 14
