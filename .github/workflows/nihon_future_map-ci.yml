name: Flutter CI (nihon_future_map)

# モノレポ構成: apps/nihon_future_map/ 配下の変更のみで起動する。
# コスト対策: macOSランナーは10倍課金のため、自動push起動は厳禁。
# 解析/テストとAndroidデバッグビルドのみpush時に自動実行し、
# iOSビルドは手動実行(workflow_dispatch)またはPR時限定にする。
# 参考: feedback_ios_cicd_cost_optimization メモリ記録
on:
  push:
    branches: [master, main]
    paths:
      - 'apps/nihon_future_map/**'
  pull_request:
    paths:
      - 'apps/nihon_future_map/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/nihon_future_map

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

  build-ios:
    # 署名なしiOSビルド。macOSランナーは10倍課金のため、
    # 手動実行またはPR時のみに限定し、pushでは絶対に自動起動しない。
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: analyze-and-test
    # in_app_purchase_storekit（新しいStoreKit2 API使用）がXcode 15.2ではコンパイルできないため、
    # geography_puzzle_kingと異なりXcodeバージョンは固定せず、macos-latestのデフォルトを使う
    # （2026-07-30、ビルド失敗により判明）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

  build-ios-signed:
    # 署名付きビルド+TestFlightアップロード。最もコストが高いジョブのため、
    # 手動実行(workflow_dispatch)限定。push/PRでは絶対に自動起動しない。
    if: github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      # 証明書とProvisioning Profileを一時キーチェーンにインポートする。
      # このリポジトリは複数アプリ共用のため、Secretsはnihon_future_map専用の
      # 名前空間（NIHON_FUTURE_MAP_接頭辞）を使い、他アプリの証明書と衝突しないようにする。
      - name: Import signing certificate and provisioning profile
        env:
          CERT_BASE64: ${{ secrets.NIHON_FUTURE_MAP_IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.NIHON_FUTURE_MAP_IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.NIHON_FUTURE_MAP_IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: temp-ci-keychain-password
        run: |
          CERT_PATH=$RUNNER_TEMP/distribution.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERT_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          API_KEY_BASE64: ${{ secrets.NIHON_FUTURE_MAP_APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.NIHON_FUTURE_MAP_APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NIHON_FUTURE_MAP_APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_$API_KEY_ID.p8
          xcrun altool --upload-app -f build/ios/ipa/*.ipa -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Upload IPA artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: nihon-future-map-ios-signed
          path: apps/nihon_future_map/build/ios/ipa/*.ipa
          retention-days: 30
